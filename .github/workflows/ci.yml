name: CI

on:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Required PR check. A release tag verifies this result through GitHub's API;
  # the same commit is not rebuilt merely because the PR was merged.
  s0-gate:
    name: S0 / Gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - name: Toolchain versions
        run: |
          rustc -Vv
          cargo -V
          rustfmt -V
          clippy-driver -V
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: s0-rust-1.97.1
      - name: Fetch locked dependency graph
        run: cargo fetch --locked
      - name: P3 deterministic lockfile contract
        run: cargo test --locked -p arandu_query lockfile
      - name: P4 logical package namespaces
        run: cargo test --locked -p arandu_query --test package_modules_p4
      - name: P4 local workspace export boundary
        run: cargo test --locked -p arandu_cli --test cli_project_gold local_workspace_dependency_resolves_only_declared_exports -- --exact
      - name: 1. Format
        run: cargo fmt --all -- --check
      - name: 2. Check
        run: cargo check --workspace --locked
      - name: 3. Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: 4. Test
        run: cargo test --workspace --locked
      - name: SL_T portable test report
        run: cargo run --locked -p arandu_cli -- test tests/projects/slt5_product --format junit --output target/sl-t/test-results.xml
      - name: Publish SL_T JUnit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sl-t-junit-${{ github.sha }}
          path: target/sl-t/test-results.xml
          if-no-files-found: error
          retention-days: 14
      - name: 5. Diagnostic docs
        run: cargo run --locked -p xtask -- check-diag-docs
      - name: 6. Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: VS Code client lint, unit and Extension Host tests
        working-directory: editors/vscode
        run: |
          npm ci --ignore-scripts
          xvfb-run -a npm test
          npm run package:check
          npm audit --audit-level=high
      - name: Generated files and snapshots leave the tree clean
        run: git diff --exit-code

  minimal-gold:
    name: Minimal gold (examples/minimal)
    if: github.event_name != 'schedule'
    needs: s0-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: minimal-rust-1.97.1
      - run: cargo test --locked -p arandu_cli --test cli_minimal_gold -- --nocapture

  diag-determinism:
    name: Diagnostic determinism
    if: github.event_name != 'schedule'
    needs: s0-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: determinism-rust-1.97.1
      - name: Typeck library (1 vs 8 threads)
        run: bash scripts/check-diag-determinism.sh arandu_typeck 8
      - name: Semantics type checker (1 vs 8 threads)
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          set +e
          cargo test --locked -p arandu_semantics --test type_checker -- --test-threads=1 --quiet >"$TMP/a" 2>&1
          EC1=$?
          cargo test --locked -p arandu_semantics --test type_checker -- --test-threads=8 --quiet >"$TMP/b" 2>&1
          ECN=$?
          set -e
          if [[ "$EC1" -ne 0 || "$ECN" -ne 0 ]]; then
            echo "error: type_checker failed (threads=1 exit=$EC1, threads=8 exit=$ECN)" >&2
            tail -40 "$TMP/a" >&2 || true
            tail -40 "$TMP/b" >&2 || true
            exit 1
          fi
          norm() {
            sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' "$1" \
              | grep -E '^(test result:|error\[|error:)' \
              | sed -E \
                -e 's/test result: ok\..*/test result: ok./' \
                -e 's/test result: FAILED\..*/test result: FAILED./' \
              | sort -u
          }
          diff -u <(norm "$TMP/a") <(norm "$TMP/b")
          echo "semantics type_checker: ok (threads 1 vs 8)"

  s1-recovery:
    name: S1 / Recovery (${{ matrix.os }})
    if: github.event_name != 'schedule'
    needs: s0-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: s1-recovery-${{ matrix.os }}-rust-1.97.1
      - name: Fetch locked dependency graph
        run: cargo fetch --locked
      - name: P3 deterministic lockfile contract
        run: cargo test --locked -p arandu_query lockfile
      - name: P4 logical package namespaces
        run: cargo test --locked -p arandu_query --test package_modules_p4
      - name: P4 local workspace export boundary
        run: cargo test --locked -p arandu_cli --test cli_project_gold local_workspace_dependency_resolves_only_declared_exports -- --exact
      - name: Import cycles and registration-order determinism
        run: cargo test --locked -p arandu_query --test salsa_imports
      - name: Query boundaries and incremental cutoffs
        run: cargo test --locked -p arandu_query --test architecture_invariants --test item_body_cutoff --test ide_diag_delta --test block_delta
      - name: Stale document IDs and analysis revisions
        run: cargo test --locked -p arandu_lsp
      - name: CFG, SSA and backend rejection parity
        run: cargo test --locked -p arandu_backend_c --test parity_tests
      - name: Host, i686 and pointer-width layouts
        run: cargo test --locked -p arandu_middle layout
      - name: Diagnostic parallelism (1 vs 8 threads)
        shell: bash
        run: bash scripts/check-diag-determinism.sh arandu_typeck 8
      - name: Reproducible release archive
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/check-package-reproducibility.sh

  install-smoke:
    name: Install smoke (${{ matrix.os }})
    if: github.event_name != 'schedule'
    needs: s0-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: install-${{ matrix.os }}-rust-1.97.1
      - name: P3 deterministic lockfile contract
        run: cargo test --locked -p arandu_query lockfile
      - name: Smoke versioned install + PATH symlink doctor
        run: |
          unset ARANDU_STDLIB
          bash scripts/smoke-install.sh
      - name: Package tarball + checksums + reinstall from archive
        run: |
          set -euo pipefail
          unset ARANDU_STDLIB
          bash scripts/package-release.sh
          TAR=$(find dist -maxdepth 1 -name 'arandu-*.tar.gz' -print -quit)
          test -n "$TAR"
          test -f "${TAR}.sha256"
          PREFIX=$(mktemp -d)
          PREFIX="$PREFIX" bash scripts/install-from-tarball.sh "$TAR"
          env -u ARANDU_STDLIB PATH="$PREFIX/bin:/usr/bin:/bin" \
            bash -c 'cd /tmp && exec "$0" doctor' "$PREFIX/bin/arandu"
          echo deadbeef > "${TAR}.sha256"
          if PREFIX=$(mktemp -d) bash scripts/install-from-tarball.sh "$TAR"; then
            echo "expected SHA-256 mismatch to abort" >&2
            exit 1
          fi

  s2-endurance:
    name: S2 / Endurance (${{ matrix.os }})
    if: github.event_name != 'schedule'
    needs: s1-recovery
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: s2-endurance-${{ matrix.os }}-rust-1.97.1
      - name: Validate project corpus and clean-rebuild oracle
        run: cargo run --locked -p xtask -- check-project-corpus
      - name: Stress module churn, identities and stale workers
        run: cargo run --locked -p xtask -- check-project-churn
      - name: Measure incremental performance and retention budgets
        run: cargo run --locked -p xtask -- check-project-performance
      - name: Run isolated adversarial fuzz regressions
        run: cargo run --locked -p xtask -- check-fuzz-regressions
      - name: Prepare native runtime for AOT integration tests
        run: cargo rustc --locked -p arandu_runtime --crate-type staticlib
      - name: P7-B / Stress cross-process cache and build publication
        run: cargo test --locked -p arandu_cli --test cache_process_concurrency --test cli_project_concurrency -- --nocapture
      - name: P7-C / Prove package output determinism under environment variance
        run: cargo test --locked -p arandu_cli --test cli_project_determinism -- --nocapture
      - name: P7-D / Reject hostile paths and archive entries
        run: cargo test --locked -p arandu_cli --test cli_project_adversarial -- --nocapture
      - name: P7-D / Validate malformed release archives
        shell: bash
        run: python3 scripts/test_release_archives.py
      - name: Stress LSP snapshots, debounce and stale document generations
        run: cargo test --locked -p arandu_lsp state::tests::s2_endurance_batches_edits_and_discards_stale_snapshots -- --exact
      - name: Measure L2 LSP end-to-end latency budgets
        run: cargo test --locked -p arandu_lsp --test stdio_lifecycle stdio_l2_corpus_performance_p50_p95 -- --ignored --exact --nocapture
      - name: L3 stress LSP crash, deadlock and stale-publication oracle
        run: cargo test --locked -p arandu_lsp --test stdio_lifecycle stdio_l3_stress_has_no_crash_deadlock_or_stale_publication -- --ignored --exact --nocapture
      - name: Publish performance and retention report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s2-performance-report-${{ github.sha }}
          path: |
            target/s2-performance-report.txt
            target/l2-lsp-performance-report.txt
          if-no-files-found: error
          retention-days: 30

  # Early warning only. Adoption happens through a reviewed rust-toolchain.toml PR.
  future-stable:
    name: Future stable (advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install latest stable with required components
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: future-stable
      - run: cargo +stable check --workspace --locked
      - run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +stable test --workspace --locked
