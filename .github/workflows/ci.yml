name: CI

on:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Keep this classifier inside the required workflow. Workflow-level path
  # filters can leave required checks pending when GitHub skips the workflow.
  scope:
    name: Change scope
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      distribution: ${{ steps.classify.outputs.distribution }}
      editor: ${{ steps.classify.outputs.editor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/classify-ci
        id: classify
        with:
          event-name: ${{ github.event_name }}
          base-sha: ${{ github.event.pull_request.base.sha }}

  preflight:
    name: Policy and architecture
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: preflight-rust-1.97.1
      - name: Canonical UTF-8/LF repository text
        run: cargo run --locked -p xtask -- check-line-endings
      - name: Compiler architecture boundaries
        run: cargo run --locked -p xtask -- check-architecture
      - name: Documentation taxonomy
        run: cargo run --locked -p xtask -- check-docs-taxonomy
      - name: Diagnostic documentation bijection
        run: cargo run --locked -p xtask -- check-diag-docs
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Generated files and snapshots leave the tree clean
        run: git diff --exit-code

  rust-core:
    name: Rust core
    if: needs.scope.outputs.code == 'true'
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: core-rust-1.97.1
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # This single invocation already includes the P3/P4, minimal Gold, CLI,
      # query, LSP and other non-ignored workspace integration tests.
      - name: Test workspace once
        run: cargo test --workspace --locked
      - name: SL_T portable JUnit contract
        run: cargo run --locked -p arandu_cli -- test tests/projects/slt5_product --format junit --output target/sl-t/test-results.xml
      - name: Publish SL_T JUnit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sl-t-junit-${{ github.sha }}
          path: target/sl-t/test-results.xml
          if-no-files-found: error
          retention-days: 14
      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  windows-portability:
    name: Windows portability
    if: needs.scope.outputs.code == 'true'
    needs: scope
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: windows-portability-rust-1.97.1
      - name: Test the complete workspace on native Windows
        run: cargo test --workspace --locked

  diag-determinism:
    name: Diagnostic determinism
    if: needs.scope.outputs.code == 'true'
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: determinism-rust-1.97.1
      - name: Typeck library (1 vs 8 threads)
        run: bash scripts/check-diag-determinism.sh arandu_typeck 8
      - name: Semantics type checker (1 vs 8 threads)
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          set +e
          cargo test --locked -p arandu_semantics --test type_checker -- --test-threads=1 --quiet >"$TMP/a" 2>&1
          EC1=$?
          cargo test --locked -p arandu_semantics --test type_checker -- --test-threads=8 --quiet >"$TMP/b" 2>&1
          ECN=$?
          set -e
          if [[ "$EC1" -ne 0 || "$ECN" -ne 0 ]]; then
            echo "error: type_checker failed (threads=1 exit=$EC1, threads=8 exit=$ECN)" >&2
            tail -40 "$TMP/a" >&2 || true
            tail -40 "$TMP/b" >&2 || true
            exit 1
          fi
          norm() {
            sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' "$1" \
              | grep -E '^(test result:|error\[|error:)' \
              | sed -E \
                -e 's/test result: ok\..*/test result: ok./' \
                -e 's/test result: FAILED\..*/test result: FAILED./' \
              | sort -u
          }
          diff -u <(norm "$TMP/a") <(norm "$TMP/b")
          echo "semantics type_checker: ok (threads 1 vs 8)"

  editor:
    name: VS Code extension
    if: needs.scope.outputs.editor == 'true'
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Lint, unit, Extension Host and package contract
        working-directory: editors/vscode
        run: |
          npm ci --ignore-scripts
          xvfb-run -a npm test
          npm run package:check
          npm audit --audit-level=high

  distribution:
    name: Distribution smoke
    if: needs.scope.outputs.distribution == 'true'
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: distribution-rust-1.97.1
      - name: Reproducible release archive
        run: bash scripts/check-package-reproducibility.sh
      - name: Install outside the checkout and reject tampering
        run: |
          set -euo pipefail
          unset ARANDU_STDLIB
          bash scripts/package-release.sh
          archive=$(find dist -maxdepth 1 -name 'arandu-*.tar.gz' -print -quit)
          test -n "$archive"
          test -f "${archive}.sha256"
          prefix=$(mktemp -d)
          ARANDU_NO_MODIFY_PATH=1 PREFIX="$prefix" \
            bash scripts/install-from-tarball.sh "$archive"
          env -u ARANDU_STDLIB PATH="$prefix/bin:/usr/bin:/bin" \
            bash -c 'cd /tmp && exec "$0" doctor' "$prefix/bin/arandu"
          echo deadbeef >"${archive}.sha256"
          if ARANDU_NO_MODIFY_PATH=1 PREFIX=$(mktemp -d) \
              bash scripts/install-from-tarball.sh "$archive"; then
            echo "expected SHA-256 mismatch to abort" >&2
            exit 1
          fi

  # Compatibility contexts for the active GitHub ruleset. They summarize the
  # native recovery evidence without recompiling the same workspace again.
  s1-recovery-status:
    name: S1 / Recovery (${{ matrix.os }})
    if: always() && github.event_name != 'schedule'
    needs: [scope, rust-core, windows-portability, diag-determinism]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            evidence: rust-core
          - os: windows-latest
            evidence: windows-portability
    runs-on: ubuntu-latest
    steps:
      - name: Require native recovery evidence when code changed
        shell: bash
        env:
          CODE_SCOPE: ${{ needs.scope.outputs.code }}
          RUST_RESULT: ${{ needs.rust-core.result }}
          WINDOWS_RESULT: ${{ needs.windows-portability.result }}
          DIAG_RESULT: ${{ needs.diag-determinism.result }}
          EVIDENCE: ${{ matrix.evidence }}
        run: |
          set -euo pipefail
          if [[ "$CODE_SCOPE" != "true" ]]; then
            echo "No product code changed; native recovery is not applicable." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$EVIDENCE" == "rust-core" ]]; then
            test "$RUST_RESULT" = success
            test "$DIAG_RESULT" = success
          else
            test "$WINDOWS_RESULT" = success
          fi
          echo "$EVIDENCE passed without rerunning covered tests." >>"$GITHUB_STEP_SUMMARY"

  # The historical ruleset also requires these names. The PR contract proves
  # that all non-ignored endurance regressions ran in the native workspace
  # suites; long stress and noisy performance probes run in scheduled-endurance.
  s2-pr-status:
    name: S2 / Endurance (${{ matrix.os }})
    if: always() && github.event_name == 'pull_request'
    needs: [scope, rust-core, windows-portability]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            evidence: rust-core
          - os: windows-latest
            evidence: windows-portability
    runs-on: ubuntu-latest
    steps:
      - name: Require PR endurance regressions when code changed
        shell: bash
        env:
          CODE_SCOPE: ${{ needs.scope.outputs.code }}
          RUST_RESULT: ${{ needs.rust-core.result }}
          WINDOWS_RESULT: ${{ needs.windows-portability.result }}
          EVIDENCE: ${{ matrix.evidence }}
        run: |
          set -euo pipefail
          if [[ "$CODE_SCOPE" != "true" ]]; then
            echo "No product code changed; endurance regressions are not applicable." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$EVIDENCE" == "rust-core" ]]; then
            test "$RUST_RESULT" = success
          else
            test "$WINDOWS_RESULT" = success
          fi
          echo "Non-ignored $EVIDENCE endurance regressions passed; long probes remain scheduled." >>"$GITHUB_STEP_SUMMARY"

  # The branch rule keeps requiring this stable name. It aggregates parallel
  # contracts and accepts an intentionally skipped conditional job.
  s0-gate:
    name: S0 / Gate
    if: always() && github.event_name != 'schedule'
    needs:
      - scope
      - preflight
      - rust-core
      - windows-portability
      - diag-determinism
      - editor
      - distribution
      - s1-recovery-status
      - s2-pr-status
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable PR contract
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          RUST_RESULT: ${{ needs.rust-core.result }}
          WINDOWS_RESULT: ${{ needs.windows-portability.result }}
          DIAG_RESULT: ${{ needs.diag-determinism.result }}
          EDITOR_RESULT: ${{ needs.editor.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
          S1_RESULT: ${{ needs.s1-recovery-status.result }}
          S2_RESULT: ${{ needs.s2-pr-status.result }}
          CODE_SCOPE: ${{ needs.scope.outputs.code }}
          EDITOR_SCOPE: ${{ needs.scope.outputs.editor }}
          DISTRIBUTION_SCOPE: ${{ needs.scope.outputs.distribution }}
        run: |
          set -euo pipefail
          failed=false
          require_success() {
            local name=$1 result=$2
            if [[ "$result" != "success" ]]; then
              echo "error: $name finished with $result" >&2
              failed=true
            fi
          }
          require_if_selected() {
            local name=$1 selected=$2 result=$3
            if [[ "$selected" == "true" ]]; then
              require_success "$name" "$result"
            elif [[ "$result" != "skipped" ]]; then
              echo "error: unselected $name unexpectedly finished with $result" >&2
              failed=true
            fi
          }
          require_success scope "$SCOPE_RESULT"
          require_success preflight "$PREFLIGHT_RESULT"
          require_if_selected rust-core "$CODE_SCOPE" "$RUST_RESULT"
          require_if_selected windows-portability "$CODE_SCOPE" "$WINDOWS_RESULT"
          require_if_selected diagnostic-determinism "$CODE_SCOPE" "$DIAG_RESULT"
          require_if_selected editor "$EDITOR_SCOPE" "$EDITOR_RESULT"
          require_if_selected distribution "$DISTRIBUTION_SCOPE" "$DISTRIBUTION_RESULT"
          require_success s1-recovery "$S1_RESULT"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            require_success s2-endurance "$S2_RESULT"
          fi
          if [[ "$failed" == true ]]; then
            exit 1
          fi
          echo "All applicable S0 contracts passed." >>"$GITHUB_STEP_SUMMARY"

  # Endurance and performance are valuable, but shared runners are a noisy
  # place to block every PR. Non-ignored regressions remain in rust-core.
  scheduled-endurance:
    name: Scheduled endurance (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: s2-endurance-${{ matrix.os }}-rust-1.97.1
      - name: Validate project corpus and clean-rebuild oracle
        run: cargo run --locked -p xtask -- check-project-corpus
      - name: Stress module churn, identities and stale workers
        run: cargo run --locked -p xtask -- check-project-churn
      - name: Measure incremental performance and retention budgets
        run: cargo run --locked -p xtask -- check-project-performance
      - name: Run isolated adversarial fuzz regressions
        run: cargo run --locked -p xtask -- check-fuzz-regressions
      - name: Prepare native runtime for AOT integration tests
        run: cargo rustc --locked -p arandu_runtime --crate-type staticlib
      - name: Stress cross-process cache and build publication
        run: cargo test --locked -p arandu_cli --test cache_process_concurrency --test cli_project_concurrency -- --nocapture
      - name: Prove package output determinism under environment variance
        run: cargo test --locked -p arandu_cli --test cli_project_determinism -- --nocapture
      - name: Reject hostile paths and archive entries
        run: cargo test --locked -p arandu_cli --test cli_project_adversarial -- --nocapture
      - name: Validate malformed release archives
        shell: bash
        run: python3 scripts/test_release_archives.py
      - name: Stress LSP snapshots, debounce and stale document generations
        run: cargo test --locked -p arandu_lsp state::tests::s2_endurance_batches_edits_and_discards_stale_snapshots -- --exact
      - name: Measure LSP end-to-end latency budgets
        run: cargo test --locked -p arandu_lsp --test stdio_lifecycle stdio_l2_corpus_performance_p50_p95 -- --ignored --exact --nocapture
      - name: Stress LSP crash, deadlock and stale-publication oracle
        run: cargo test --locked -p arandu_lsp --test stdio_lifecycle stdio_l3_stress_has_no_crash_deadlock_or_stale_publication -- --ignored --exact --nocapture
      - name: Publish performance and retention report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s2-performance-report-${{ github.sha }}
          path: |
            target/s2-performance-report.txt
            target/l2-lsp-performance-report.txt
          if-no-files-found: error
          retention-days: 30

  # Early warning only. Adoption happens through a reviewed rust-toolchain.toml PR.
  future-stable:
    name: Future stable (advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install latest stable with required components
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: future-stable
      - run: cargo +stable check --workspace --locked
      - run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +stable test --workspace --locked
