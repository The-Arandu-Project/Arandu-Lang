name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz / ${{ matrix.target }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_lex
          - fuzz_parse
          - fuzz_lex_simd
          - fuzz_parse_structured
          - fuzz_pipeline
          - fuzz_cycles
          - fuzz_genref
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: arandu_fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Run bounded libFuzzer campaign
        run: >-
          cargo +nightly fuzz run --fuzz-dir arandu_fuzz ${{ matrix.target }} --
          -max_total_time=1800
          -max_len=65536
          -timeout=2
          -rss_limit_mb=1024
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: arandu_fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
