[package]
name = "arandu_fuzz"
version = "0.1.0-rc.4"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
arandu_lexer = { path = "../crates/arandu_lexer" }
arandu_parser = { path = "../crates/arandu_parser" }
arandu_fuzz_support = { path = "../crates/arandu_fuzz_support" }

[[bin]]
name = "fuzz_pipeline"
path = "fuzz_targets/fuzz_pipeline.rs"
test = false
doc = false

[[bin]]
name = "fuzz_cycles"
path = "fuzz_targets/fuzz_cycles.rs"
test = false
doc = false

[[bin]]
name = "fuzz_lex"
path = "fuzz_targets/fuzz_lex.rs"

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"

[[bin]]
name = "fuzz_lex_simd"
path = "fuzz_targets/fuzz_lex_simd.rs"

[[bin]]
name = "fuzz_parse_structured"
path = "fuzz_targets/fuzz_parse_structured.rs"

[[bin]]
name = "fuzz_genref"
path = "fuzz_targets/fuzz_genref.rs"
test = false
doc = false
